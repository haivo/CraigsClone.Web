# Postgres for machines that don't already have one.
#
# On the original dev machine an existing container (pg-simple-agent, Postgres 16,
# host port 5433) is reused instead, and this file is NOT started there.
# Everywhere else: `docker compose up -d`, then `dotnet run`.
#
# Port 5433 is deliberate so it matches appsettings.Development.json without edits.

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-craigsclone}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
